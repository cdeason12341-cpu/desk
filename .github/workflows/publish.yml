name: publish
# Builds the Pages site from main (web/) + data JSON fetched from a secret gist.
# DATA_PATH and GIST_ID are repo secrets: they never appear in any git ref.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/publish.yml']
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          DATA_PATH: ${{ secrets.DATA_PATH }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$DATA_PATH" && test -n "$GIST_ID"
          mkdir -p _site && cp -r web/. _site/
          # GITHUB_TOKEN gets 403 on the gists API; secret gists are readable unauthenticated by id.
          curl -fsS --retry 3 --retry-delay 5 -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" -o /tmp/gist.json
          python3 - <<'PY'
          import json, os, re
          out = os.path.join("_site", "d", os.environ["DATA_PATH"])
          os.makedirs(out, exist_ok=True)
          g = json.load(open("/tmp/gist.json"))
          n = 0
          for name, f in g["files"].items():
              if not re.fullmatch(r"[A-Za-z0-9_.-]+\.json", name) or f.get("truncated"):
                  raise SystemExit("bad or truncated gist file")
              json.loads(f["content"])  # must be valid JSON
              open(os.path.join(out, name), "w").write(f["content"])
              n += 1
          print("data files:", n)
          PY
          rm -f /tmp/gist.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Delete Pages artifact (it contains DATA_PATH in file paths)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
          echo "artifacts deleted"
