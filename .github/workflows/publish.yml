name: publish
# Builds the Pages site from main (web/) + data JSON fetched from a secret gist.
# DATA_PATH and GIST_ID are repo secrets: they never appear in any git ref.
on:
  workflow_dispatch:
    inputs:
      rev:
        description: gist revision sha (immutable, avoids the 60s API cache)
        required: false
        default: ''
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/publish.yml']
permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
concurrency:
  group: pages
  # Never cancel an in-flight Pages deploy. Cancelling one can leave the site
  # stuck on an old artifact while later runs still report success (DECISION 47).
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        env:
          DATA_PATH: ${{ secrets.DATA_PATH }}
          GIST_ID: ${{ secrets.GIST_ID }}
          REV: ${{ inputs.rev }}
        run: |
          set -euo pipefail
          [[ -z "${REV:-}" || "$REV" =~ ^[0-9a-f]{40}$ ]]
          test -n "$DATA_PATH" && test -n "$GIST_ID"
          mkdir -p _site && cp -r web/. _site/
          # Unauthenticated gist GET (GITHUB_TOKEN is 403 on gists). Don't print
          # the URL: it contains GIST_ID. Retry 403/transient errors, then raw.
          fetch_gist() {
            local try url
            url="https://api.github.com/gists/${GIST_ID}${REV:+/${REV}}"
            for try in 1 2 3 4 5; do
              if curl -fsS --retry 2 --retry-delay 3 -A "desk-publish" \
                -H "Accept: application/vnd.github+json" \
                "$url" -o /tmp/gist.json 2>/tmp/gist.err; then
                return 0
              fi
              echo "gist api fetch failed (try ${try})"
              sleep $((try * 4))
            done
            if curl -fsS --retry 3 --retry-delay 5 -A "desk-publish" \
              "https://gist.githubusercontent.com/cdeason12341-cpu/${GIST_ID}/raw/${REV}/bundle.json" \
              -o /tmp/bundle.json 2>/tmp/gist.err; then
              python3 -c 'import json; json.dump({"files":{"bundle.json":{"content":open("/tmp/bundle.json").read(),"truncated":False}}}, open("/tmp/gist.json","w"))'
              rm -f /tmp/bundle.json
              echo "gist raw fallback ok"
              return 0
            fi
            echo "gist fetch failed"
            return 1
          }
          fetch_gist
          rm -f /tmp/gist.err
          python3 - <<'PY'
          import json, os, re, urllib.request
          out = os.path.join("_site", "d", os.environ["DATA_PATH"])
          os.makedirs(out, exist_ok=True)
          g = json.load(open("/tmp/gist.json"))
          def content(f):
              if f.get("truncated"):
                  # raw_url of a pinned revision is immutable
                  with urllib.request.urlopen(f["raw_url"], timeout=60) as r:
                      return r.read().decode()
              return f["content"]
          ok = re.compile(r"^[A-Za-z0-9_-]+(/[A-Za-z0-9_-]+)*\.json$")
          n = 0
          for name, f in g["files"].items():
              body = content(f)
              if name == "bundle.json":
                  b = json.loads(body)
                  for rel, env in b["files"].items():
                      if not ok.match(rel) or set(env) != {"v", "iv", "ct"}:
                          raise SystemExit("bad bundle entry")
                      p = os.path.join(out, rel)
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      open(p, "w").write(json.dumps(env))
                      n += 1
              elif ok.match(name):
                  json.loads(body)
                  open(os.path.join(out, name), "w").write(body)
                  n += 1
              else:
                  raise SystemExit("bad gist file")
          print("data files:", n)
          PY
          rm -f /tmp/gist.json
      - uses: actions/configure-pages@v5
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      # The Pages API requires pages_build_version to be a git SHA that exists
      # in the repo (a gist rev 404s). deploy-pages always sends github.sha, so
      # data-only publishes reused one version and the site went stale (DECISION 47).
      # Mint a unique empty-tree commit on pages-deploys (not main; no files,
      # no secrets) and deploy that version.
      - name: Deploy Pages (unique pages_build_version)
        env:
          REV: ${{ inputs.rev || github.sha }}
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          set -euo pipefail
          [[ "$REV" =~ ^[0-9a-f]{40}$ ]]
          test -n "${ARTIFACT_ID}"
          export GIT_AUTHOR_NAME="desk-pages"
          export GIT_AUTHOR_EMAIL="41898282+github-actions[bot]@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          EMPTY_TREE=$(git hash-object -t tree --stdin -w </dev/null)
          BUILD_SHA=$(git commit-tree "$EMPTY_TREE" -m "pages ${REV:0:7}")
          git push -f origin "${BUILD_SHA}:refs/heads/pages-deploys"
          export BUILD_SHA
          echo "pages build sha ${BUILD_SHA:0:7} (gist ${REV:0:7})"
          AUD=$(python3 -c 'import os,urllib.parse; print(urllib.parse.quote("https://github.com/"+os.environ["GITHUB_REPOSITORY_OWNER"], safe=""))')
          OIDC=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUD}" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          export OIDC
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          def redact(s):
              for k in ("OIDC", "GH_TOKEN"):
                  v = os.environ.get(k) or ""
                  if v:
                      s = s.replace(v, "<redacted>")
              return s
          payload = json.dumps({
              "artifact_id": int(os.environ["ARTIFACT_ID"]),
              "pages_build_version": os.environ["BUILD_SHA"],
              "oidc_token": os.environ["OIDC"],
          }).encode()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/pages/deployments",
              data=payload, method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as r:
                  body = json.load(r)
          except urllib.error.HTTPError as e:
              raise SystemExit(f"create deployment failed {e.code}: {redact(e.read().decode()[:500])}")
          print("created pages deployment", os.environ["BUILD_SHA"][:7], "gist", os.environ["REV"][:7], "status", body.get("status") or "ok")
          PY
          for i in $(seq 1 36); do
            if st=$(gh api "repos/${GITHUB_REPOSITORY}/pages/deployments/${BUILD_SHA}" --jq '.status' 2>/dev/null); then
              echo "pages status: ${st}"
              case "${st}" in
                succeed|success) exit 0 ;;
                fail|failure|error|canceled|cancelled) echo "pages deploy ${st}"; exit 1 ;;
              esac
            else
              echo "pages status: pending"
            fi
            sleep 5
          done
          echo "pages deploy timeout"
          exit 1
      - name: Delete Pages artifact (it contains DATA_PATH in file paths)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" --jq '.artifacts[].id'); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
          done
          echo "artifacts deleted"
